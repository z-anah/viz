name: Deploy bmp-plugins to GitHub Pages

on:
  push:
    branches: [ main ] # Change to 'master' if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install pnpm CLI before setting up Node.js
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Matches or exceeds standard pnpm versions

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: bmp-plugins/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: bmp-plugins

      - name: Build project
        run: pnpm run build
        working-directory: bmp-plugins

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bmp-plugins/dist