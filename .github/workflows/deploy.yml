name: Deploy BMP-PLUGINS to GitHub Pages

on:
  push:
    branches: [ main ] # Change to 'master' if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: BMP-PLUGINS/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: BMP-PLUGINS

      - name: Build project
        run: npm run build
        working-directory: BMP-PLUGINS

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./BMP-PLUGINS/dist