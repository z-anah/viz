<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../lib.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'prime-green': '#13675A',
                        'prime-mint': '#20C997',
                        'prime-deep': '#0C3832',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-white">
    <div id="app" class="flex-1 p-2.5 flex flex-col justify-between" v-cloak>
        <div v-if="loading" class="flex items-center justify-center h-full text-slate-500 text-xs font-medium">
            <i class="fas fa-spinner fa-spin mr-2"></i> Loading Distribution Data...
        </div>
        <div v-else-if="error" class="flex items-center justify-center h-full text-red-600 text-xs p-2 text-center">
            {{ error }}
        </div>
        <div v-else class="flex flex-col justify-between h-full">
            <div class="text-[11px] font-bold text-[#00463E] uppercase tracking-tight">
                Distribution TM (estates)
            </div>
            <div class="grid grid-cols-3 gap-2 my-1 text-center">
                <div class="bg-[#D1FAE5] p-1 rounded border border-[#10B981]">
                    <div class="text-[10px] font-bold text-[#00463E]">High</div>
                    <div class="text-lg font-black text-[#006D65] leading-none">
                        {{ cardData.high }}<span class="text-[10px] text-[#00463E]/70 font-normal">/25</span>
                    </div>
                    <div class="text-[8px] text-[#00463E]/70 mt-0.5">{{ cardData.highDiff }} vs Jul</div>
                </div>
                <div class="bg-[#FEF3C7] p-1 rounded border border-[#F59E0B]">
                    <div class="text-[10px] font-bold text-[#F59E0B]">Mid</div>
                    <div class="text-lg font-black text-[#F59E0B] leading-none">
                        {{ cardData.mid }}<span class="text-[10px] text-[#00463E]/70 font-normal">/25</span>
                    </div>
                    <div class="text-[8px] text-[#00463E]/70 mt-0.5">{{ cardData.midDiff }} vs Jul</div>
                </div>
                <div class="bg-[#FEE2E2] p-1 rounded border border-[#EF4444]">
                    <div class="text-[10px] font-bold text-[#EF4444]">Low</div>
                    <div class="text-lg font-black text-[#EF4444] leading-none">
                        {{ cardData.low }}<span class="text-[10px] text-[#00463E]/70 font-normal">/25</span>
                    </div>
                    <div class="text-[8px] text-[#00463E]/70 mt-0.5">±0 vs Jul</div>
                </div>
            </div>
            <div class="text-[8px] text-[#00463E]/60">
                High ≥ 80% · Mid 75–80% · Low &lt; 75% (usulan)
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
