<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../lib.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'prime-green': '#13675A',
                        'prime-mint': '#20C997',
                        'prime-deep': '#0C3832',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-white">
    <div id="app" class="flex-1 p-2.5 flex flex-col justify-between" v-cloak>
        <div v-if="loading" class="flex items-center justify-center h-full text-slate-500 text-xs font-medium">
            <i class="fas fa-spinner fa-spin mr-2"></i> Loading Region Breakdown Data...
        </div>
        <div v-else-if="error" class="flex items-center justify-center h-full text-red-600 text-xs p-2 text-center">
            {{ error }}
        </div>
        <div v-else class="flex flex-col justify-between h-full">
            <div class="text-[11px] font-bold text-[#00463E] uppercase tracking-tight mb-1">
                High / Mid / Low by Region · TM
            </div>
            <div class="space-y-1.5">
                <div v-for="reg in regionBreakdown" :key="reg.name" class="space-y-1">
                    <div class="text-[10px] font-bold text-[#00463E]">{{ reg.name }}</div>
                    <div class="grid grid-cols-3 gap-1 text-center text-[9px] font-extrabold">
                        <div class="bg-[#D1FAE5] text-[#006D65] py-1 px-1 rounded flex items-center justify-between border border-[#10B981]/20">
                            <span>{{ reg.highCount }}<span class="font-normal text-[8px] text-[#00463E]/70">/{{ reg.total }}</span></span>
                            <span class="font-normal text-[8px] text-[#00463E]/70">{{ reg.highPct }}%</span>
                            <span :class="String(reg.highDiff).includes('+') ? 'text-[#10B981]' : 'text-[#EF4444]'" class="text-[7px]">{{ reg.highDiff }}</span>
                        </div>
                        <div class="bg-[#FEF3C7] text-[#F59E0B] py-1 px-1 rounded flex items-center justify-between border border-[#F59E0B]/20">
                            <span>{{ reg.midCount }}<span class="font-normal text-[8px] text-[#00463E]/70">/{{ reg.total }}</span></span>
                            <span class="font-normal text-[8px] text-[#00463E]/70">{{ reg.midPct }}%</span>
                            <span :class="String(reg.midDiff).includes('+') ? 'text-[#10B981]' : 'text-[#EF4444]'" class="text-[7px]">{{ reg.midDiff }}</span>
                        </div>
                        <div class="bg-[#FEE2E2] text-[#EF4444] py-1 px-1 rounded flex items-center justify-between border border-[#EF4444]/20">
                            <span>{{ reg.lowCount }}<span class="font-normal text-[8px] text-[#00463E]/70">/{{ reg.total }}</span></span>
                            <span class="font-normal text-[8px] text-[#00463E]/70">{{ reg.lowPct }}%</span>
                            <span></span>
                        </div>
                    </div>
                    <div class="w-full bg-[#F8FAFC] h-1 rounded-full overflow-hidden flex border border-[#E2E8F0]">
                        <div class="bg-[#10B981] h-full" :style="{ width: reg.highBar + '%' }"></div>
                        <div class="bg-[#F59E0B] h-full" :style="{ width: reg.midBar + '%' }"></div>
                        <div class="bg-[#EF4444] h-full" :style="{ width: reg.lowBar + '%' }"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
