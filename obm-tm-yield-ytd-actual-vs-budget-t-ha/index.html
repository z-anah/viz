<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../lib.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'prime-green': '#13675A',
                        'prime-mint': '#20C997',
                        'prime-deep': '#0C3832',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-white">
    <div id="app" class="flex-1 p-2.5 flex flex-col justify-between" v-cloak>
        <div v-if="loading" class="flex items-center justify-center h-full text-slate-500 text-xs font-medium">
            <i class="fas fa-spinner fa-spin mr-2"></i> Loading Yield Chart Data...
        </div>
        <div v-else-if="error" class="flex items-center justify-center h-full text-red-600 text-xs p-2 text-center">
            {{ error }}
        </div>
        <div v-else class="flex flex-col justify-between h-full">
            <div class="flex items-center justify-between mb-1">
                <h3 class="text-[11px] font-bold text-[#00463E] uppercase">TM Yield YTD · Actual vs Budget (t/ha)</h3>
                <div class="flex items-center space-x-2 text-[9px] text-[#00463E]/80 font-medium">
                    <span class="flex items-center"><span class="w-2 h-2 bg-[#E2E8F0] border border-slate-300 mr-1 inline-block rounded-xs"></span>Budget</span>
                    <span class="flex items-center"><span class="w-2 h-2 bg-[#006D65] mr-1 inline-block rounded-xs"></span>Actual</span>
                </div>
            </div>
            <div class="flex-1 relative min-h-0">
                <canvas id="yieldChart"></canvas>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
