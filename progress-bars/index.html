<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress Bars — Tableau</title>

  <script src="lib.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>

<body class="text-gray-900 p-1">
  <main id="app" class="">

    <section v-if="loading" class="rounded-xl border border-gray-200 bg-white p-6 text-sm text-gray-500">
      Loading worksheet data...
    </section>

    <section v-else-if="error" class="rounded-xl border border-red-200 bg-white p-6 text-sm text-red-700">
      {{ error }}
    </section>

    <section v-else-if="!rows.length" class="rounded-xl border border-gray-200 bg-white p-6 text-sm text-gray-500">
      No data found in the worksheet.
    </section>

    <section v-else class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      <article v-for="row in rows" :key="row.category"
        class="min-w-0 rounded-xl border border-gray-200 bg-white p-4 transition-shadow hover:shadow-sm">
        <div class="mb-3 flex items-start justify-between gap-3">
          <h2 class="break-words text-sm font-semibold">
            {{ row.category || '(Null category)' }}
          </h2>
          <span class="shrink-0 text-sm font-bold tabular-nums"
            :class="row.valid && row.pct >= 100 ? 'text-red-700' : 'text-gray-900'">
            {{ row.valid ? formatPercent(row.pct) : 'N/A' }}
          </span>
        </div>

        <div class="h-2.5 overflow-hidden rounded-full bg-gray-100" role="progressbar" :aria-label="row.category"
          :aria-valuemin="0" :aria-valuemax="100" :aria-valuenow="row.valid ? Math.min(100, Math.max(0, row.pct)) : 0">
          <div class="h-full rounded-full bg-[#C8102E] transition-all duration-500"
            :style="{ width: `${row.valid ? Math.min(100, Math.max(0, row.pct)) : 0}%` }"></div>
        </div>

        <div class="mt-2.5 flex justify-between gap-3 text-xs text-gray-500 tabular-nums">
          <span>Actual: {{ row.valid ? formatNumber(row.actual) : 'N/A' }}</span>
          <span>Target: {{ row.valid ? formatNumber(row.target) : 'N/A' }}</span>
        </div>
      </article>
    </section>
  </main>
</body>

</html>
