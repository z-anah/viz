<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speedometer Gauges — Tableau</title>

  <script src="../lib.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>

<body class="text-gray-900">
  <main id="app" class="w-full h-full p-3 sm:p-4 box-border flex flex-col">

    <section v-if="loading" class="rounded-xl border border-gray-200 bg-white p-6 text-sm text-gray-500 shadow-sm">
      Loading worksheet data...
    </section>

    <section v-else-if="error" class="rounded-xl border border-red-200 bg-white p-6 text-sm text-red-700 shadow-sm">
      {{ error }}
    </section>

    <section v-else-if="!rows.length"
      class="rounded-xl border border-gray-200 bg-white p-6 text-sm text-gray-500 shadow-sm">
      No data found in the worksheet.
    </section>

    <section v-else class="w-full h-full grid gap-4"
      style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); grid-auto-rows: minmax(220px, 1fr);">
      <article v-for="(row, index) in rows" :key="row.category || index"
        class="min-w-0 min-h-0 rounded-xl border border-gray-200 bg-white p-3 shadow-sm flex flex-col justify-between overflow-hidden">

        <!-- Header Badge -->
        <div
          class="flex flex-row items-center justify-center shrink-0 bg-teal-50 border border-teal-100 px-3 py-1 rounded-full shadow-sm gap-2 mx-auto">
          <span class="w-2 h-2 rounded-full bg-teal-600 animate-pulse"></span>
          <span class="text-xs font-extrabold tracking-wider text-teal-800 uppercase truncate max-w-[180px]">
            {{ row.category || '(Null category)' }}
          </span>
        </div>

        <!-- Chart Container (Takes up available space fluidly) -->
        <div :id="'chart-' + index" class="w-full flex-1 my-1 min-h-[140px]"></div>

        <!-- Footer Meta -->
        <div class="w-full flex justify-between shrink-0 text-xs text-gray-500 tabular-nums px-1">
          <span>Actual: {{ row.valid ? formatNumber(row.actual) : 'N/A' }}</span>
          <span>Target: {{ row.valid ? formatNumber(row.target) : 'N/A' }}</span>
        </div>
      </article>
    </section>
  </main>
</body>

</html>
