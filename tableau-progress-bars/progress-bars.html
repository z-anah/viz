<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress Bars — Tableau Viz Extension</title>
  <link rel="stylesheet" href="progress-bars.css">
  <script src="https://tableau.github.io/extensions-api/lib/tableau.extensions.1.latest.js"></script>
  <script defer src="progress-bars.js"></script>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">MY VIZ</p>
        <h1>Progress</h1>
      </div>
      <span id="status" class="status">Preview data</span>
    </header>
    <section id="content" class="content" aria-live="polite"></section>
    <footer id="footer" class="footer">Preview mode · Add the extension to a Tableau worksheet to use workbook data.
    </footer>
  </main>
</body>

</html>
